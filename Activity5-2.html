<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend><i>Contact Information</i></legend>
        <label for="fname">First name:</label>
        <input type="text" name="fname" id="fname"> <br>
        <label for="lname">Last name:</label>
        <input type="text" name="lname" id="lname"> <br>
        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email">
      </fieldset>
      <fieldset>
        <legend><i>Competition Question</i></legend>
        How tall is the Eiffel Tower in Paris, France? <br>
        <input type="radio" name="height" id="ans1" value="584">
        <label for="ans1">584ft</label><br>
        <input type="radio" name="height" id="ans2" value="784">
        <label for="ans2">784ft</label><br>
        <input type="radio" name="height" id="ans3" value="984">
        <label for="ans3">984ft</label><br>
        <input type="radio" name="height" id="ans4" value="1184">
        <label for="ans4">1184ft</label><br>
      </fieldset>
      <fieldset>
        <legend><i>Tiebreaker Question</i></legend>
        <label for="question"
          >In 25 words or less, say why you would like to win $10,000:</label>
        <br>
        <textarea name="question" id="question" rows="10" cols="39"></textarea>
      </fieldset>
      <fieldset>
        <legend><i>Enter competition</i></legend>
        <input type="submit" value="Enter Competition">
      </fieldset>
    </form>
  </body>
</html>
